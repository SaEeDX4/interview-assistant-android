# CI scaffolding (TRANSFER-MAP §7 P1): build + unit tests + asset checksums + mapping checks.
# The checksum and mapping-table jobs are added as the parity assets land (P3+).
name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle --refresh-dependencies :app:assembleDebug :app:testDebugUnitTest :core:testDebugUnitTest :client:testDebugUnitTest :contracts:testDebugUnitTest
      # P7 (TRANSFER-MAP §5.5): coverage gate — :core and :client must stay at or above
      # 90% line coverage; jacocoTestCoverageVerification fails the build below the floor.
      # The report tasks emit the per-package XML/HTML coverage reports.
      # --no-build-cache: the coverage gate must measure THIS tree on every run;
      # a cached verification verdict is not a measurement (P7 fix round 4).
      - run: gradle --no-build-cache :core:jacocoTestReport :client:jacocoTestReport :core:jacocoTestCoverageVerification :client:jacocoTestCoverageVerification
      - name: Print measured line coverage (JaCoCo XML totals)
        if: always()
        run: |
          for f in $(find . -path '*reports/jacoco*' -name '*.xml' | sort); do
            echo "== $f"
            grep -o '<counter type="LINE"[^>]*/>' "$f" | tail -1
          done
      - name: Upload unit-test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/test-results/**"
          if-no-files-found: ignore
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/build/reports/jacoco/**"
          if-no-files-found: ignore
      - name: Verify shared assets are byte-identical (checksums)
        run: cd parity && sha256sum -c assets.sha256
