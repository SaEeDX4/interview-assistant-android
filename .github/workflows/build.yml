# CI scaffolding (TRANSFER-MAP §7 P1): build + unit tests + asset checksums + mapping checks.
# The checksum and mapping-table jobs are added as the parity assets land (P3+).
name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle --refresh-dependencies :core:testDebugUnitTest --tests "com.interviewassistant.core.providers.ProviderTests" --tests "com.interviewassistant.core.orchestration.Rc2EngineTimingTests" # TEMP-DIAG
      - name: Upload unit-test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/test-results/**"
          if-no-files-found: ignore
      - name: Verify shared assets are byte-identical (checksums)
        run: cd parity && sha256sum -c assets.sha256
